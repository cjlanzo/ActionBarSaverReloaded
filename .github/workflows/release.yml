name: Release
on:
  push:
    tags:
      - "**"
# Lets the packager create the GitHub release
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The packager skips an upload whose token is missing and still succeeds
      - name: Check the CurseForge token is set
        run: test -n "$CF_API_TOKEN" || { echo "::error::CF_API_TOKEN secret is empty"; exit 1; }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
