name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # WoW runs Lua 5.1
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v6
      - name: Install tools
        run: luarocks install busted && luarocks install luacheck
      - name: Lint
        run: luacheck .
      - name: Test
        run: busted
